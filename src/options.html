<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page to Markdown Pro — Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>Page to Markdown Pro</h1>
        <p>Local, reliable defaults for one-click Markdown export.</p>
      </header>

      <section class="card">
        <h2>Click behavior</h2>
        <label class="field">
          <span>Toolbar click mode</span>
          <select id="actionMode">
            <option value="auto">Auto — choose the best content root</option>
            <option value="main">Main content only</option>
            <option value="full">Full page</option>
          </select>
        </label>
        <label class="checkbox"><input id="saveAs" type="checkbox"><span>Show “Save As” before downloading</span></label>
      </section>

      <section class="card two-col">
        <div>
          <h2>Markdown output</h2>
          <label class="checkbox"><input id="includeFrontMatter" type="checkbox"><span>Include YAML front matter</span></label>
          <label class="checkbox"><input id="prependTitleHeadingIfMissing" type="checkbox"><span>Add <code># Title</code> when needed</span></label>
          <label class="checkbox"><input id="includeSourceLink" type="checkbox"><span>Add a source link</span></label>
          <label class="checkbox"><input id="includeImages" type="checkbox"><span>Keep meaningful images</span></label>
          <label class="checkbox"><input id="stripTrackingParams" type="checkbox"><span>Strip common tracking parameters</span></label>
        </div>
        <div>
          <h2>Files and tables</h2>
          <label class="checkbox"><input id="prependDateToFilename" type="checkbox"><span>Prefix filenames with today’s date</span></label>
          <label class="field"><span>Maximum filename length</span><input id="maxFilenameLength" type="number" min="40" max="200" step="1"></label>
          <label class="field">
            <span>Table mode</span>
            <select id="tableMode">
              <option value="smart">Smart — Markdown with safe HTML fallback</option>
              <option value="markdown">Prefer Markdown tables</option>
              <option value="html">Keep tables as sanitized HTML</option>
            </select>
          </label>
        </div>
      </section>

      <section class="card tips">
        <h2>Shortcuts</h2>
        <p><strong>Alt+Shift+D</strong> exports the page. <strong>Alt+Shift+S</strong> exports the current selection.</p>
      </section>

      <footer class="footer">
        <button id="saveButton" class="button" type="button">Save settings</button>
        <span id="status" class="status" aria-live="polite"></span>
      </footer>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
