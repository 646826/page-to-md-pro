name: Temporary 0.2.2 test setup

on:
  push:
    branches:
      - codex/0.2.2-list-fidelity
    paths:
      - .github/workflows/temporary-0.2.2-test-setup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/0.2.2-list-fidelity
          fetch-depth: 0

      - name: Register ordered-list fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path('tests/run-fixture-tests.mjs')
          runner = runner_path.read_text(encoding='utf-8')
          marker = """  {
            file: 'fixture-tables.html', mode: 'main', options: { includeFrontMatter: false, includeSourceLink: false },
"""
          descriptor = """  {
            file: 'fixture-lists.html', mode: 'full',
            options: { includeFrontMatter: false, includeSourceLink: false },
            checks: [
              '0. Zero\\n1. One',
              '-2. Negative two\\n-1. Negative one',
              '3. Default three\\n7. Reset seven\\n6. Then six',
              '10. Ten first line\\n\\n    Ten continuation\\n    - Nested bullet\\n11. Eleven'
            ],
            rejects: [
              '1. Zero',
              '1. Default three\\n2. Reset seven',
              '10. Ten first line\\n\\n  Ten continuation',
              '\\n  - Nested bullet'
            ]
          },
"""
          if runner.count(marker) != 1:
              raise SystemExit('Could not find unique fixture insertion point')
          runner_path.write_text(runner.replace(marker, descriptor + marker, 1), encoding='utf-8')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          ci_marker = """      - name: Run aggregate release verification entry point
            run: npm test
"""
          ci_step = """      - name: Test ordered-list fidelity fixture
            run: timeout 120s node tests/run-fixture-tests.mjs fixture-lists.html

"""
          if ci.count(ci_marker) != 1:
              raise SystemExit('Could not find unique CI insertion point')
          ci_path.write_text(ci.replace(ci_marker, ci_step + ci_marker, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/run-fixture-tests.mjs .github/workflows/ci.yml

      - name: Commit and push test registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/run-fixture-tests.mjs .github/workflows/ci.yml
          git commit -m "test: reproduce ordered list fidelity regressions"
          git push origin HEAD:codex/0.2.2-list-fidelity
