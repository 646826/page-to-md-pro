name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Repair verified srcset parser increment
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/content.js')
          source = path.read_text(encoding='utf-8')
          broken = r"while (index < input.length && !/[\s,]/.test(input[index])) index = 1;"
          fixed = r"while (index < input.length && !/[\s,]/.test(input[index])) index += 1;"
          count = source.count(broken)
          if count > 1:
              raise SystemExit(f'Expected at most one broken srcset loop, found {count}.')
          if count == 1:
              path.write_text(source.replace(broken, fixed), encoding='utf-8')
              print('Repaired the non-data srcset parser increment.')
          elif fixed not in source:
              raise SystemExit('Neither the broken nor fixed srcset loop is present.')
          PY
          git diff --check
          if git diff --quiet -- src/content.js; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit repaired srcset parser
        if: ${{ github.event_name == 'push' && steps.repair.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content.js
          git commit -m "fix(extraction): advance the srcset parser cursor"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run syntax and control-byte checks
        run: npm run check

      - name: Test shared utilities
        run: node --test tests/shared.test.mjs

      - name: Test storage fallback
        run: node --test tests/storage.test.mjs

      - name: Test background orchestration
        run: node --test tests/background.test.mjs

      - name: Test offscreen lifecycle
        run: node --test tests/offscreen.test.mjs

      - name: Test package metadata
        run: node --test tests/package.test.mjs

      - name: Test deterministic build
        run: node --test tests/build.test.mjs

      - name: Test Chrome Web Store upload-only behavior
        run: node --test tests/cws-release.test.mjs

      - name: Test article fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-article.html

      - name: Test table fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-tables.html

      - name: Test math fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-math.html

      - name: Test modern-web fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-modern-web.html

      - name: Test base-URL fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-base-url.html

      - name: Test security fixture
        shell: bash
        run: |
          set -o pipefail
          timeout 120s node tests/run-fixture-tests.mjs fixture-security.html 2>&1 | tee security-fixture.log

      - name: Upload security fixture diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: security-fixture-diagnostics-${{ github.sha }}
          path: security-fixture.log
          if-no-files-found: error
          retention-days: 7

      - name: Test selection-media fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-selection-media.html

      - name: Test large-DOM fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-large-dom.html

      - name: Test over-budget selection fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-large-selection.html

      - name: Validate source package
        run: npm run validate:package

      - name: Build Chrome Web Store package
        run: npm run build:zip

      - name: Validate release package allowlist
        run: npm run validate:package

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: page-to-md-pro-${{ github.sha }}
          path: page-to-md-pro.zip
          if-no-files-found: error
          retention-days: 14
