name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Detect release payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .release-content ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Decode content payload
        if: ${{ steps.payload.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import hashlib

          parts = sorted(Path('.release-content').glob('content.b64.part.*'))
          if not parts:
              raise SystemExit('No content payload parts found.')

          chunks = [part.read_bytes().replace(b'\r', b'').replace(b'\n', b'') for part in parts]

          def decode(value: bytes) -> bytes:
              padded = value + (b'=' * (-len(value) % 4))
              return base64.b64decode(padded, validate=True)

          try:
              decoded = decode(b''.join(chunks))
              mode = 'joined-stream'
          except binascii.Error:
              decoded = b''.join(decode(chunk) for chunk in chunks)
              mode = 'independent-parts'

          output = Path('src/content.js')
          output.write_bytes(decoded)
          if not decoded:
              raise SystemExit('Decoded content payload is empty.')
          print(f'Decoded {len(parts)} content parts using {mode}.')
          print(f'src/content.js sha256={hashlib.sha256(decoded).hexdigest()} bytes={len(decoded)}')
          PY

      - name: Reconstruct test archive
        if: ${{ steps.payload.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_parts < <(find .release-content -maxdepth 1 -type f -name 'tests.bin.part.*' -print | sort)
          if [[ "${#test_parts[@]}" -eq 0 ]]; then
            echo "No test payload parts found." >&2
            exit 1
          fi
          cat "${test_parts[@]}" > /tmp/tests.tar.gz
          gzip -t /tmp/tests.tar.gz
          echo "tests.tar.gz sha256=$(sha256sum /tmp/tests.tar.gz | cut -d' ' -f1) bytes=$(stat -c%s /tmp/tests.tar.gz)"

      - name: Extract test payload
        if: ${{ steps.payload.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests
          tar -xzf /tmp/tests.tar.gz
          test -f tests/run-fixture-tests.mjs
          test -f tests/shared.test.mjs
          test -f tests/background.test.mjs
          test -f tests/package.test.mjs
          echo "Extracted $(find tests -type f | wc -l | tr -d ' ') test files."

      - name: Remove release transport
        if: ${{ steps.payload.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-content
          git diff --check

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run syntax checks
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Chromium fixture tests
        run: npm run test:fixtures

      - name: Validate source package
        run: npm run validate:package

      - name: Build Chrome Web Store package
        run: npm run build:zip

      - name: Validate release package allowlist
        run: npm run validate:package

      - name: Commit reconstructed release files
        if: ${{ github.event_name == 'push' && steps.payload.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content.js tests .release-content
          if git diff --cached --quiet; then
            echo "No reconstructed changes to commit."
            exit 0
          fi
          git commit -m "feat: complete 0.2.0 extraction and test suite"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: page-to-md-pro-${{ github.sha }}
          path: page-to-md-pro.zip
          if-no-files-found: error
          retention-days: 14
