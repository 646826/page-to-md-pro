name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Reconstruct verified release payload when present
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .release-content ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cat .release-content/content.b64.part.* | base64 --decode > src/content.js
          echo "80cc10402cf119610f1ecaeb37a564b2f2a4dbb8ba3e58d8e6ea412c1380648f  src/content.js" | sha256sum --check --strict

          cat .release-content/tests.bin.part.* > /tmp/tests.tar.gz
          echo "df88100fb1ba9dfabb64309cbb641fde86d9b48a55c552752607adfe5f9790e8  /tmp/tests.tar.gz" | sha256sum --check --strict

          rm -rf tests
          tar -xzf /tmp/tests.tar.gz
          test "$(find tests -type f | wc -l)" -eq 17
          node --check src/content.js
          find tests -type f -print0 | sort -z | xargs -0 -n1 sh -c 'case "$1" in *.js|*.mjs) node --check "$1" ;; esac' _
          rm -rf .release-content
          git diff --check
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run syntax, unit, fixture, and package checks
        run: npm test
      - name: Build Chrome Web Store package
        run: npm run build:zip
      - name: Validate release package allowlist
        run: npm run validate:package

      - name: Commit reconstructed release files
        if: ${{ steps.assemble.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content.js tests .release-content
          git commit -m "feat: complete 0.2.0 extraction and test suite"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: page-to-md-pro-${{ github.sha }}
          path: page-to-md-pro.zip
          if-no-files-found: error
          retention-days: 14
