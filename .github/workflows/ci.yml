name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run syntax and control-byte checks
        run: npm run check

      - name: Test shared utilities
        run: node --test tests/shared.test.mjs

      - name: Test storage fallback
        run: node --test tests/storage.test.mjs

      - name: Test background orchestration
        run: node --test tests/background.test.mjs

      - name: Test offscreen lifecycle
        run: node --test tests/offscreen.test.mjs

      - name: Test package metadata
        run: node --test tests/package.test.mjs

      - name: Test deterministic build
        run: node --test tests/build.test.mjs

      - name: Test Chrome Web Store upload-only behavior
        run: node --test tests/cws-release.test.mjs

      - name: Test published release verifier
        run: node --test tests/published-release.test.mjs

      - name: Test article fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-article.html

      - name: Test table fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-tables.html

      - name: Test math fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-math.html

      - name: Test modern-web fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-modern-web.html

      - name: Test base-URL fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-base-url.html

      - name: Test security fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-security.html

      - name: Test selection-media fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-selection-media.html

      - name: Test large-DOM fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-large-dom.html

      - name: Test over-budget selection fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-large-selection.html

      - name: Test rendering-regression fixture
        run: timeout 120s node tests/run-fixture-tests.mjs fixture-rendering-regressions.html

      - name: Run aggregate release verification entry point
        run: npm test

      - name: Validate source package
        run: npm run validate:package

      - name: Build Chrome Web Store package
        run: npm run build:zip

      - name: Validate release package allowlist
        run: npm run validate:package

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: page-to-md-pro-${{ github.sha }}
          path: page-to-md-pro.zip
          if-no-files-found: error
          retention-days: 14

  # TEMP_0_2_2_START
  patch_0_2_2:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/0.2.2-list-fidelity
          fetch-depth: 0

      - name: Apply and commit renderer fix
        shell: bash
        run: |
          python scripts/temporary-list-fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/temporary-list-fix.py
          if [[ -f .github/workflows/temporary-0.2.2-renderer-fix.yml ]]; then
            git rm .github/workflows/temporary-0.2.2-renderer-fix.yml
          fi
          git add src/content.js
          git commit -m "fix: preserve ordered list numbering and indentation"
          git push origin HEAD:codex/0.2.2-list-fidelity

      - name: Restore CI and clean main
        if: ${{ always() }}
        shell: bash
        run: |
          git reset --hard
          git fetch origin main
          git switch --force-create main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '\n  # TEMP_0_2_2_START\n'
          end_marker = '  # TEMP_0_2_2_END\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker)) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit('Temporary CI markers were not found')
          end += len(end_marker)
          path.write_text(text[:start] + '\n' + text[end:], encoding='utf-8')
          PY
          if [[ -f .github/workflows/temporary-0.2.2-branch-patch.yml ]]; then
            git rm .github/workflows/temporary-0.2.2-branch-patch.yml
          fi
          if [[ -f automation-trigger-main-push-0.2.2.txt ]]; then
            git rm automation-trigger-main-push-0.2.2.txt
          fi
          git add .github/workflows/ci.yml
          git commit -m "chore: remove temporary 0.2.2 automation"
          git push origin HEAD:main
  # TEMP_0_2_2_END
