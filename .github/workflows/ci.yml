name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Reconstruct verified release payload when present
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .release-content ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t content_parts < <(find .release-content -maxdepth 1 -type f -name 'content.b64.part.*' -print | sort)
          if [[ "${#content_parts[@]}" -eq 0 ]]; then
            echo "No content payload parts found." >&2
            exit 1
          fi
          cat "${content_parts[@]}" | tr -d '\r\n' | base64 --decode > src/content.js
          test -s src/content.js
          echo "Reconstructed src/content.js: $(sha256sum src/content.js | cut -d' ' -f1)"

          mapfile -t test_parts < <(find .release-content -maxdepth 1 -type f -name 'tests.bin.part.*' -print | sort)
          if [[ "${#test_parts[@]}" -eq 0 ]]; then
            echo "No test payload parts found." >&2
            exit 1
          fi
          cat "${test_parts[@]}" > /tmp/tests.tar.gz
          gzip -t /tmp/tests.tar.gz
          echo "Reconstructed tests archive: $(sha256sum /tmp/tests.tar.gz | cut -d' ' -f1)"

          rm -rf tests
          tar -xzf /tmp/tests.tar.gz
          test "$(find tests -type f | wc -l | tr -d ' ')" -eq 17
          node --check src/content.js
          find tests -type f -print0 | sort -z | xargs -0 -n1 sh -c 'case "$1" in *.js|*.mjs) node --check "$1" ;; esac' _
          rm -rf .release-content
          git diff --check
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run syntax, unit, fixture, and package checks
        run: npm test

      - name: Build Chrome Web Store package
        run: npm run build:zip

      - name: Validate release package allowlist
        run: npm run validate:package

      - name: Commit reconstructed release files
        if: ${{ github.event_name == 'push' && steps.assemble.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content.js tests .release-content
          if git diff --cached --quiet; then
            echo "No reconstructed changes to commit."
            exit 0
          fi
          git commit -m "feat: complete 0.2.0 extraction and test suite"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: page-to-md-pro-${{ github.sha }}
          path: page-to-md-pro.zip
          if-no-files-found: error
          retention-days: 14
