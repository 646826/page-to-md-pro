<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ordered List Fidelity</title>
</head>
<body>
  <main>
    <article>
      <h1>Ordered List Fidelity</h1>

      <ol start="0">
        <li>Zero</li>
        <li>One</li>
      </ol>

      <ol start="-2">
        <li>Negative two</li>
        <li>Negative one</li>
      </ol>

      <ol reversed>
        <li>Default three</li>
        <li value="7">Reset seven</li>
        <li>Then six</li>
      </ol>

      <ol start="10">
        <li>
          Ten first line
          <p>Ten continuation</p>
          <ul><li>Nested bullet</li></ul>
        </li>
        <li>Eleven</li>
      </ol>
    </article>
  </main>
</body>
</html>
